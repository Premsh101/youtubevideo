# Coolify: "Docker Compose" resource → point at this repo. Set the env vars in Coolify's UI,
# upload the Vertex SA JSON as a file mount (or paste it into VERTEX_SA_JSON).
services:
  studio:
    build: .
    # No host port: Coolify's Traefik proxies your domain to the container's port 8000.
    # (Publishing 8000 collides with the Coolify dashboard itself.)
    expose:
      - "8000"
    environment:
      - VERTEX_SA_JSON=${VERTEX_SA_JSON}
      - GOOGLE_CLOUD_LOCATION=${GOOGLE_CLOUD_LOCATION:-us-central1}
      - USD_TO_INR=${USD_TO_INR:-84}
      - YOUTUBE_REDIRECT_URI=${YOUTUBE_REDIRECT_URI:-https://rhymes.example.com/youtube/oauth2callback}
      - YOUTUBE_PRIVACY=${YOUTUBE_PRIVACY:-private}
      - APP_PASSWORD=${APP_PASSWORD:-}   # optional login, empty = no login
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
      - CHANNEL_NAME=${CHANNEL_NAME:-Sunave Kids}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL}
      - META_APP_ID=${META_APP_ID}
      - META_APP_SECRET=${META_APP_SECRET}
      - META_LOGIN_CONFIG_ID=${META_LOGIN_CONFIG_ID}
      - META_PAGE_ID=${META_PAGE_ID}
      - IMAGE_RPM=${IMAGE_RPM:-5}
      - MOCK_AI=${MOCK_AI:-0}
      - RENDER_WORKERS=${RENDER_WORKERS:-2}
      - MAX_PARALLEL_JOBS=${MAX_PARALLEL_JOBS:-1}
      - CACHE_MAX_GB=${CACHE_MAX_GB:-25}
    volumes:
      - studio_data:/srv/data      # characters, cache, finished videos, YouTube token  (BACK THIS UP: tokens live here)
    stop_grace_period: 60s         # let a running ffmpeg finish its file before a redeploy kills it
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8000/api/languages"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
volumes:
  studio_data:
